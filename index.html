    <script>
      // Suprimir avisos benignos de WebSocket/HMR desconectado no ambiente de sandbox
      window.addEventListener('unhandledrejection', function (event) {
        var msg = event && event.reason ? (event.reason.message || String(event.reason)) : '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite') !== -1) {
          event.preventDefault();
          event.stopImmediatePropagation && event.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function (event) {
        var msg = event && event.message ? event.message : '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('[vite]') !== -1) {
          event.preventDefault();
          event.stopImmediatePropagation && event.stopImmediatePropagation();
        }
      });
    </script>
