<svg viewBox="0 0 600 160" fill="none" xmlns="http://www.w3.org/2000/svg" className="w-full h-full preserve-3d">
  <defs>
    <filter id="brush-blur" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <linearGradient id="brush-grad-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#ffffff" stopOpacity="0.85" />
      <stop offset="50%" stopColor="#ffffff" stopOpacity="0.95" />
      <stop offset="100%" stopColor="#ffffff" stopOpacity="0.8" />
    </linearGradient>
    <linearGradient id="brush-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#E1FB15" stopOpacity="0.3" />
      <stop offset="50%" stopColor="#ffffff" stopOpacity="0.2" />
      <stop offset="100%" stopColor="#32D583" stopOpacity="0.3" />
    </linearGradient>
  </defs>
  
  {/* Glow sutil de fundo */}
  <path
    d="M 35,90 C 80,45 180,50 320,65 C 430,78 510,48 570,30 C 585,25 565,65 520,95 C 440,140 330,135 210,130 C 110,125 45,130 20,110 C 10,95 20,80 35,90 Z"
    fill="url(#brush-glow)"
    filter="blur(8px)"
  />

