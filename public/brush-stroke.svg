  {/* Manchas/gotas de tinta editorial nas pontas */}
  <circle cx="12" cy="104" r="2.5" fill="currentColor" opacity="0.6" />
  <circle cx="20" cy="116" r="1.8" fill="currentColor" opacity="0.4" />
  <circle cx="586" cy="14" r="1.5" fill="currentColor" opacity="0.7" />
  <circle cx="594" cy="22" r="2" fill="currentColor" opacity="0.5" />
