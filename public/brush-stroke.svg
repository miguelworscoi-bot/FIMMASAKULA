  <path
    d="M 520,38 C 545,30 570,22 590,14 C 585,18 565,30 540,42 Z"
    fill="currentColor"
    opacity="0.85"
  />
  <path
    d="M 500,52 C 530,40 560,30 582,24 C 576,28 550,42 520,58 Z"
    fill="currentColor"
    opacity="0.7"
  />
  <path
    d="M 480,68 C 515,55 545,45 570,38 C 560,45 530,62 495,76 Z"
    fill="currentColor"
