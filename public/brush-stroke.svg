  <path
    d="M 28,102 C 50,118 90,126 145,130 C 230,136 320,134 410,122 C 470,114 520,95 555,75 C 550,82 510,105 450,122 C 360,140 260,144 165,138 C 105,134 55,126 22,112 C 16,108 20,100 28,102 Z"
