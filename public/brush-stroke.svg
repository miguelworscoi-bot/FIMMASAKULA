  <path
    d="M 65,72 C 120,58 200,56 290,60 C 380,64 470,52 560,25 C 575,20 580,24 565,32 C 485,60 395,72 300,68 C 210,64 130,68 65,78 C 55,80 50,75 65,72 Z"
    fill="currentColor"
    opacity="0.75"
